name: CI - Pruebas Automatizadas
on: [push]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3 
        with:
          version: "latest"
          enable-cache: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      
      - name: Instalar dependencias del sistema (Xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libdbus-1-3

      - name: Instalar dependencias del proyecto (uv sync)
        run: uv sync --locked

      - name: Ejecutar pruebas (pytest)
        run: xvfb-run -a uv run pytest